name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: cd backend && pip install -r requirements-dev.txt
      - name: Run tests
        run: cd backend && python -m pytest tests -q

  frontend:
    name: Frontend tests + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: cd frontend && npm ci
      - name: Run unit tests
        run: cd frontend && npx vitest run
      - name: Build
        run: cd frontend && npm run build

  publish:
    name: Build + push image
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    # Only tagged releases (v1.0.0, v1.2.3, ...) publish an image.
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"

      # arm64 is built under QEMU emulation — slower, but it's what puts
      # Decidarr on Raspberry Pis and ARM NASes (v1.11 launch prep).
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Multi-arch manifests can't be `load:`ed into the daemon, so the
      # old build-once-push-twice becomes two pushes sharing the GHA build
      # cache (the second is a pure cache hit). GHCR goes FIRST — its auth
      # is the automatic GITHUB_TOKEN, so a Docker Hub problem (e.g. an
      # expired token) can never cost us the deployable artifact.
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build + push to GHCR (amd64 + arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Docker Hub second — a failure here still turns the run red (it stays
      # visible, not silently swallowed) but the GHCR image above is already
      # published.
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build + push to Docker Hub (amd64 + arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            decidarr/decidarr:latest
            decidarr/decidarr:${{ steps.version.outputs.version }}
          cache-from: type=gha

  release:
    name: GitHub Release
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Every tag already carries a written annotation — publish it as the
      # release body so github.com/decidarr/decidarr/releases (where the
      # in-app update notice points) is never an empty page.
      - name: Create release from the tag annotation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          BODY="$(git for-each-ref "refs/tags/$TAG" --format='%(contents)')"
          gh release create "$TAG" --title "$TAG" --notes "$BODY" --verify-tag \
            || gh release edit "$TAG" --notes "$BODY"
